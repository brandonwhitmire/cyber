<script>
(function () {
  document.querySelectorAll('.markdown input[type="checkbox"]').forEach(function (cb, i) {
    cb.removeAttribute('disabled');
    var key = 'cb_' + location.pathname + '_' + i;
    cb.checked = localStorage.getItem(key) === 'true';
    cb.addEventListener('change', function () {
      localStorage.setItem(key, cb.checked);
    });
  });

  document.querySelectorAll('.markdown details').forEach(function (el, i) {
    var key = 'expand_' + location.pathname + '_' + i;
    var saved = localStorage.getItem(key);
    if (saved !== null) {
      el.open = saved === 'true';
    }
    el.addEventListener('toggle', function () {
      if (document.documentElement.classList.contains('expert-mode')) {
        return;
      }
      localStorage.setItem(key, String(el.open));
    });
  });

  function codeText(block) {
    if (block.matches('code')) {
      return block.innerText.replace(/\n$/, '');
    }
    var code = block.querySelector('td:last-child code') || block.querySelector('code');
    return (code ? code.innerText : block.innerText).replace(/\n$/, '');
  }

  var copyIcon = '\u29C9';

  function makeCopyButton(getText) {
    var button = document.createElement('button');
    button.type = 'button';
    button.className = 'copy-code';
    button.textContent = copyIcon;
    button.setAttribute('aria-label', 'Copy');
    button.title = 'Copy';
    button.addEventListener('click', function (event) {
      event.preventDefault();
      event.stopPropagation();
      if (!navigator.clipboard || !navigator.clipboard.writeText) {
        return;
      }
      navigator.clipboard.writeText(getText()).then(function () {
        button.textContent = '\u2713\uFE0E';
        button.classList.add('is-copied');
        setTimeout(function () {
          button.textContent = copyIcon;
          button.classList.remove('is-copied');
        }, 1600);
      });
    });
    return button;
  }

  function addCopyButton(block) {
    var pre = block.tagName === 'PRE' ? block : block.querySelector('pre');
    var host = pre || block;
    if (host.querySelector(':scope > .copy-code')) {
      return;
    }
    host.classList.add('has-copy');
    host.appendChild(makeCopyButton(function () {
      return codeText(block);
    }));
  }

  document.querySelectorAll('.markdown .highlight, .markdown pre:has(> code)').forEach(function (block) {
    if (block.matches('pre') && block.closest('.highlight')) {
      return;
    }
    addCopyButton(block);
  });

  document.querySelectorAll('.markdown code').forEach(function (code) {
    if (code.closest('pre, .highlight') || code.querySelector('.copy-code')) {
      return;
    }
    var text = code.innerText.replace(/\n$/, '');
    var button = makeCopyButton(function () {
      return text;
    });
    button.classList.add('copy-code-inline');
    code.classList.add('has-copy');
    code.appendChild(button);
  });

  var chevron = '<svg viewBox="0 -960 960 960" aria-hidden="true"><path d="M504-480 320-664l56-56 240 240-240 240-56-56 184-184Z"/></svg>';

  function isMobileLayout() {
    return window.matchMedia('(max-width: 56rem)').matches;
  }

  function setupSidebarToggle(opts) {
    var panel = document.querySelector(opts.panel);
    if (!panel) {
      return;
    }
    var button = document.createElement('button');
    button.type = 'button';
    button.className = 'sidebar-toggle ' + opts.btnClass;
    button.innerHTML = chevron;
    function collapsedState() {
      if (isMobileLayout() && opts.mobileControl) {
        var box = document.getElementById(opts.mobileControl);
        return !(box && box.checked);
      }
      return document.documentElement.classList.contains(opts.collapsedClass);
    }
    function sync() {
      var collapsed = collapsedState();
      button.classList.toggle('is-collapsed', collapsed);
      button.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
      button.setAttribute('aria-label', collapsed ? opts.expandLabel : opts.collapseLabel);
      button.title = collapsed ? opts.expandLabel : opts.collapseLabel;
    }
    button.addEventListener('click', function () {
      if (isMobileLayout() && opts.mobileControl) {
        var box = document.getElementById(opts.mobileControl);
        if (box) {
          box.checked = !box.checked;
        }
        sync();
        return;
      }
      var collapsed = document.documentElement.classList.toggle(opts.collapsedClass);
      try {
        localStorage.setItem(opts.storageKey, collapsed ? '1' : '0');
      } catch (e) {}
      sync();
    });
    if (opts.mobileControl) {
      var box = document.getElementById(opts.mobileControl);
      if (box) {
        box.addEventListener('change', sync);
      }
    }
    document.body.appendChild(button);
    sync();
    window.matchMedia('(max-width: 56rem)').addEventListener('change', sync);
  }

  setupSidebarToggle({
    panel: '.book-menu',
    btnClass: 'sidebar-toggle-nav',
    collapsedClass: 'nav-collapsed',
    storageKey: 'book-nav-collapsed',
    mobileControl: 'menu-control',
    collapseLabel: 'Collapse navigation',
    expandLabel: 'Expand navigation'
  });

  setupSidebarToggle({
    panel: '.book-toc',
    btnClass: 'sidebar-toggle-toc',
    collapsedClass: 'toc-collapsed',
    storageKey: 'book-toc-collapsed',
    collapseLabel: 'Collapse table of contents',
    expandLabel: 'Expand table of contents'
  });

  var isChecklistPage = /\/00-alpha-checklist\/?$/.test(location.pathname);

  if (isChecklistPage) {
    var clearBtn = document.createElement('button');
    clearBtn.type = 'button';
    clearBtn.className = 'clear-checklist';
    clearBtn.textContent = 'Clear Checklist';
    clearBtn.addEventListener('click', function () {
      Object.keys(localStorage)
        .filter(function (k) { return k.startsWith('cb_' + location.pathname); })
        .forEach(function (k) { localStorage.removeItem(k); });
      document.querySelectorAll('.markdown input[type="checkbox"]').forEach(function (cb) {
        cb.checked = false;
      });
    });
    document.body.appendChild(clearBtn);
  } else {
    var detailsSnapshot = null;
    function syncExpertDetails(on) {
      var nodes = document.querySelectorAll('.markdown details');
      if (on) {
        detailsSnapshot = Array.prototype.map.call(nodes, function (el) {
          return el.open;
        });
        nodes.forEach(function (el) {
          el.open = true;
        });
        return;
      }
      if (detailsSnapshot) {
        nodes.forEach(function (el, i) {
          el.open = detailsSnapshot[i];
        });
        detailsSnapshot = null;
      }
    }

    var expertBtn = document.createElement('button');
    expertBtn.type = 'button';
    expertBtn.className = 'expert-mode-toggle';
    expertBtn.textContent = 'Expert';
    function syncExpert() {
      var on = document.documentElement.classList.contains('expert-mode');
      expertBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
      expertBtn.setAttribute('aria-label', on ? 'Turn off Expert mode' : 'Turn on Expert mode');
      expertBtn.title = on
        ? 'Expert mode on: showing commands only'
        : 'Expert mode: hide explanations, show commands';
      expertBtn.classList.toggle('is-on', on);
    }
    expertBtn.addEventListener('click', function () {
      var on = document.documentElement.classList.toggle('expert-mode');
      try {
        localStorage.setItem('book-expert-mode', on ? '1' : '0');
      } catch (e) {}
      syncExpertDetails(on);
      syncExpert();
    });
    document.body.appendChild(expertBtn);
    syncExpert();
    if (document.documentElement.classList.contains('expert-mode')) {
      syncExpertDetails(true);
    }
  }
})();
</script>
