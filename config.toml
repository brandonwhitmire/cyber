baseURL = "/"
title = "Cheatsheet"
theme = "hugo-book"
themesDir = ".themes"

# Ignore .venv directories and other non-content files
ignoreFiles = [
  ".venv/"
]

[markup.goldmark.renderer]
  # Allow HTML and markdown rendering in shortcodes (required for tables in details shortcode)
  unsafe = true

[markup.tableOfContents]
  # Include H1 headers in TOC (default is 2, which excludes H1)
  startLevel = 1
  endLevel = 6

[params]
defaultTheme = "auto"
ShowToc = true
TocOpen = true
BookTheme = "auto"
BookToC = true
BookSearch = true
BookComments = false
BookFavicon = "favicon.svg"
BookSection = "Docs"

[params.homeInfoParams]
Title = "Cheatsheet"
Content = "Study notes and tools for networking, web app hacking, and pentesting."
